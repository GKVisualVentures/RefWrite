<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Referee Card Reports</title>
<meta name="description" content="Submit yellow, red and blue card reports and produce a signed, tamper-evident report suitable for disciplinary procedures.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='9' y='4' width='14' height='24' rx='2' fill='%23d62828'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f6f3; --surface:#fff; --ink:#17181a; --muted:#5d6168; --line:#dcdcd5; --accent:#16355f;
  --yellow:#f4c20d; --red:#d62828; --blue:#1f6fd1; --ok:#1c7c45; --warn:#a15c00; --bad:#b3261e;
  --yellow-bg:#fff6cc; --red-bg:#fde8e8; --blue-bg:#e3eefc; --grey-bg:#ececE6;
  --radius:10px; --font:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101214; --surface:#191c1f; --ink:#ecedee; --muted:#a2a7ad; --line:#2f3438; --accent:#8db4ee;
    --yellow-bg:#3a3205; --red-bg:#3b1515; --blue-bg:#14253d; --grey-bg:#23272a; --ok:#58c383; --warn:#e0a13c; --bad:#ff8a80;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--ink);text-decoration:none}
.cardmark{width:14px;height:22px;border-radius:2px;background:var(--red);box-shadow:-7px 3px 0 var(--yellow),7px 3px 0 var(--blue);margin:0 8px}
nav{display:flex;gap:14px;align-items:center}
nav a{color:var(--ink);text-decoration:none;font-weight:600}
nav a[data-nav].on{color:var(--accent);text-decoration:underline;text-underline-offset:6px}
h1{font-size:1.6rem;margin:24px 0 4px}
h2{font-size:1.15rem;margin:0 0 4px}
h3{font-size:1rem;margin:18px 0 6px}
.sub{color:var(--muted);margin:0 0 16px}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0d1b2e}}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:6px 12px;min-height:34px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:16px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;border-left:6px solid var(--line)}
.tile b{display:block;font-size:1.9rem;line-height:1.1}
.tile span{color:var(--muted);font-size:.9rem}
.tile.y{border-left-color:var(--yellow)}.tile.r{border-left-color:var(--red)}.tile.b{border-left-color:var(--blue)}.tile.a{border-left-color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:16px}
.bars{display:grid;gap:6px;margin-top:8px}
.bar-row{display:grid;grid-template-columns:minmax(80px,38%) 1fr 28px;gap:8px;align-items:center;font-size:.92rem}
.bar-row .track{background:var(--grey-bg);border-radius:4px;height:14px;overflow:hidden}
.bar-row .fill{height:100%;background:var(--accent);border-radius:4px}
.bar-row .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 12px}
.filters input,.filters select{min-width:150px}
table{width:100%;border-collapse:collapse;font-size:.93rem}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
tr.clickable{cursor:pointer}tr.clickable:hover{background:var(--grey-bg)}
.tablewrap{overflow-x:auto}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700;white-space:nowrap}
.pill.yellow{background:var(--yellow-bg);color:#6b5400;border:1px solid var(--yellow)}
.pill.red{background:var(--red-bg);color:var(--bad);border:1px solid var(--red)}
.pill.blue{background:var(--blue-bg);color:#1457a8;border:1px solid var(--blue)}
.pill.abandoned{background:var(--grey-bg);border:1px solid var(--line)}
.pill.draft{background:var(--grey-bg);color:var(--muted);border:1px dashed var(--muted)}
.pill.final{background:#e0f3e8;color:var(--ok);border:1px solid var(--ok)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.yellow{color:var(--yellow)} :root:not([data-theme="light"]) .pill.blue{color:#8db4ee} :root:not([data-theme="light"]) .pill.final{background:#12301f}}
.empty{text-align:center;padding:36px 12px;color:var(--muted)}
/* form */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}.side{position:static!important}}
.side{position:sticky;top:72px}
.cardpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:12px}
.cardpick label{cursor:pointer;position:relative;min-width:0}
.cardpick input{position:absolute;opacity:0}
.cp{border:2px solid var(--line);border-radius:var(--radius);padding:12px;background:var(--surface);display:flex;gap:12px;align-items:center;min-height:76px}
.cp i{width:26px;height:38px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.25)}
.cp b{display:block}.cp small{color:var(--muted);display:block;line-height:1.25}
.cpy i{background:var(--yellow)}.cpr i{background:var(--red)}.cpb i{background:var(--blue)}.cpa i{background:repeating-linear-gradient(45deg,#888,#888 4px,#bbb 4px,#bbb 8px)}
.cardpick input:checked+.cp{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.cardpick input:focus-visible+.cp{outline:3px solid var(--blue);outline-offset:2px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
@media (max-width:640px){.fields{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f>label,.f>.lab{font-weight:600;font-size:.93rem}
.req{color:var(--bad)}
.hint{color:var(--muted);font-size:.85rem}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=tel],input[type=email],input[type=search],select,textarea{font:inherit;color:inherit;background:var(--surface);border:1px solid #8a8f96;border-radius:8px;padding:9px 10px;width:100%;min-height:42px}
textarea{min-height:110px;resize:vertical}
.f.err input,.f.err select,.f.err textarea{border-color:var(--bad);border-width:2px}
.errmsg{color:var(--bad);font-size:.85rem}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{display:inline-flex;align-items:center;gap:6px;border:1px solid #8a8f96;border-radius:999px;padding:6px 12px;cursor:pointer;background:var(--surface);font-size:.93rem;min-height:36px}
.opt input{margin:0}
.opt:has(input:checked){background:var(--accent);color:#fff;border-color:var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .opt:has(input:checked){color:#0d1b2e}}
.laws{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface)}
.laws h4{margin:10px 0 4px;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.lawrow{display:flex;gap:10px;align-items:flex-start;padding:5px 0;cursor:pointer}
.lawrow code{font-weight:700;min-width:48px}
.lawrow input{margin-top:5px;flex:none}
.chosen{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chosen .pill{background:var(--grey-bg);border:1px solid var(--line)}
.sect{border-top:3px solid var(--accent)}
.sect.cy{border-top-color:var(--yellow)}.sect.cr{border-top-color:var(--red)}.sect.cb{border-top-color:var(--blue)}
.note{background:var(--blue-bg);border-radius:8px;padding:10px 12px;font-size:.9rem;margin:8px 0}
.note.warn{background:var(--yellow-bg)}
.meter{height:10px;background:var(--grey-bg);border-radius:6px;overflow:hidden;margin:8px 0}
.meter i{display:block;height:100%;background:var(--ok);transition:width .2s}
.checks{list-style:none;margin:8px 0 0;padding:0;font-size:.9rem}
.checks li{display:flex;gap:8px;padding:3px 0;cursor:pointer}
.checks li .mk{flex:none;width:18px;text-align:center;font-weight:700}
.checks li.ok{color:var(--muted)}.checks li.ok .mk{color:var(--ok)}
.checks li.miss .mk{color:var(--bad)}.checks li.rec .mk{color:var(--warn)}
.sigpad{border:1px dashed #8a8f96;border-radius:8px;background:#fff;touch-action:none;width:100%;height:150px;display:block}
.saved{color:var(--muted);font-size:.85rem}
/* report document */
.doc{background:#fff;color:#111;border:1px solid var(--line);border-radius:6px;padding:28px 30px;font-size:14px;line-height:1.45;max-width:850px;margin:0 auto}
.doc h1{font-size:1.25rem;margin:0}
.doc h2{font-size:.95rem;text-transform:uppercase;letter-spacing:.05em;background:#eee;padding:4px 8px;margin:18px 0 6px;border-left:5px solid #16355f;color:#111}
.doc.t-yellow h2{border-left-color:#f4c20d}.doc.t-red h2{border-left-color:#d62828}.doc.t-blue h2{border-left-color:#1f6fd1}
.doc table{font-size:13px}.doc th{width:28%;background:#fafafa;color:#333;text-transform:none;letter-spacing:0;font-size:13px;border:1px solid #ccc;padding:5px 8px}
.doc td{border:1px solid #ccc;padding:5px 8px}
.doc .hd{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border-bottom:3px solid #111;padding-bottom:10px}
.doc .big{display:inline-block;width:34px;height:48px;border:1px solid #333;border-radius:3px;vertical-align:middle;margin-right:10px}
.doc .narr{white-space:pre-wrap;border:1px solid #ccc;padding:8px 10px;min-height:60px}
.doc .sig{max-height:90px;border-bottom:1px solid #333}
.doc .hash{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;word-break:break-all}
.doc .foot{font-size:11px;color:#444;margin-top:14px}
.doc .draftmark{color:#b3261e;font-weight:700;border:2px solid #b3261e;padding:2px 8px;display:inline-block;transform:rotate(-3deg)}
.doc .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.noprint{}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal>div{background:var(--surface);border-radius:12px;padding:20px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
.foot{color:var(--muted);font-size:.82rem;padding:24px 16px}
@media print{
  body{background:#fff}
  .topbar,.noprint,.foot,.modal{display:none!important}
  .wrap{max-width:none;padding:0}
  .doc{border:0;padding:0;max-width:none;font-size:12px}
  .doc h2,.doc th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .doc .big{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .doc section{break-inside:avoid}
  @page{margin:14mm}
}
.filters input,.filters select{width:auto;flex:1 1 180px}

.steps{display:flex;gap:6px;overflow-x:auto;margin:0 0 14px;padding-bottom:4px;scrollbar-width:thin}
.step{font:inherit;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap;min-height:38px}
.step .n{width:22px;height:22px;border-radius:50%;background:var(--grey-bg);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.step.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:700}
.step.on .n{background:var(--accent);color:#fff}
.step em{font-style:normal;font-size:.75rem;font-weight:700;border-radius:999px;padding:0 7px}
.step em.bad{background:var(--red-bg);color:var(--bad)}.step em.ok{color:var(--ok)}
.stepnav{margin:4px 0 20px}
.aitools{margin-top:8px;display:grid;gap:6px}
.aitext{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0}
.aitools ul{margin:6px 0 0;padding-left:20px}
nav a.btn.primary.on{color:#fff;text-decoration:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav a.btn.primary.on{color:#0d1b2e}}

</style>
</head>

<script>
/* Referee Card Reports – static app for GitHub Pages. No server; data stays in this browser unless exported. */
(function () {
"use strict";
const CFG = window.APP_CONFIG, LAWS = window.LAWS;
const KEY = "wp-card-reports-v1";
const $ = (s, r = document) => r.querySelector(s);

const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  red: { name: "Red card", long: "RED CARD – Send off", code: "RC", sub: "Player sent off" },
  blue: { name: "Blue card", long: "BLUE CARD – Suspected concussion / head-injury removal", code: "BC", sub: "Suspected concussion" },
  abandoned: { name: "Match blown off", long: "MATCH BLOWN OFF / ABANDONED", code: "MB", sub: "Match abandoned" }
};
const YN = ["Yes", "No"], YNU = ["Yes", "No", "Unsure"];

/* ---------- storage ---------- */
let mem = {};
const store = {
  all() { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { return mem; } },
  save(o) { mem = o; try { localStorage.setItem(KEY, JSON.stringify(o)); return true; } catch (e) { return false; } },
  get(id) { return this.all()[id]; },
  put(r) { const o = this.all(); o[r.id] = r; return this.save(o); },
  del(id) { const o = this.all(); delete o[id]; this.save(o); }
};

/* ---------- helpers ---------- */
const getP = (o, p) => p.split(".").reduce((a, k) => (a == null ? a : a[k]), o);
const setP = (o, p, v) => { const k = p.split("."); let a = o; k.slice(0, -1).forEach(x => a = a[x] = a[x] || {}); a[k.at(-1)] = v; };
const empty = v => v == null || v === "" || (Array.isArray(v) && !v.length);
const today = () => new Date().toISOString().slice(0, 10);
const fmtDate = d => { if (!d) return "—"; const x = new Date(d + (d.length === 10 ? "T00:00" : "")); return isNaN(x) ? d : x.toLocaleDateString("en-ZA", { day: "2-digit", month: "long", year: "numeric" }); };
const fmtDT = d => d ? new Date(d).toLocaleString("en-ZA", { dateStyle: "long", timeStyle: "medium" }) : "—";
const rid = t => `${CFG.orgName}-${new Date().getFullYear()}-${TYPES[t].code}-${Math.random().toString(36).slice(2, 7).toUpperCase()}`;
function canon(v) { if (Array.isArray(v)) return "[" + v.map(canon).join(",") + "]"; if (v && typeof v === "object") return "{" + Object.keys(v).sort().map(k => JSON.stringify(k) + ":" + canon(v[k])).join(",") + "}"; return JSON.stringify(v); }
async function sha(text) { try { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); } catch (e) { return "unavailable"; } }
const contentOf = r => { const c = JSON.parse(JSON.stringify(r)); delete c.hash; delete c.addenda; delete c.status; delete c.updatedAt; return c; };
const hashReport = r => sha(canon(contentOf(r)));
const hasLaw = (s, ...c) => (s.laws || []).some(x => c.includes(x));

const download = (name, text, mime) => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: mime })); a.download = name; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); };

let R = null, showErrors = false, dirtyTimer = null, lastSig = "";

function blank(type) {
  return { id: type ? rid(type) : "", type, status: "draft", createdAt: new Date().toISOString(), match: { date: today(), level: "Community" },
    player: {}, laws: [], inc: {}, dc: {}, dec: {}, yc: {}, rc: {}, bc: {}, ab: {}, ev: {},
    officials: [{ role: "Referee" }, { role: "Assistant referee 1" }, { role: "Assistant referee 2" }], reporter: null, decl: {} };
}
const isShown = (sec, s) => !sec.show || sec.show(s);
const fShown = (f, s) => !f.showIf || f.showIf(s);
const fReq = (f, s) => typeof f.req === "function" ? f.req(s) : !!f.req;
const fRec = (f, s) => typeof f.rec === "function" ? f.rec(s) : !!f.rec;
const visSig = s => SECTIONS.map(x => isShown(x, s) ? 1 : 0).join("") + SECTIONS.flatMap(x => x.fields || []).map(f => fShown(f, s) && (fReq(f, s) ? "R" : fRec(f, s) ? "r" : "-")).join("") + (s.laws || []).join(",");

/* completeness: returns [{id,label,level,anchor}] */
function check(s) {
  const out = [];
  if (!s.type) return [{ level: "req", label: "Choose the card type", anchor: "cardtype" }];
  SECTIONS.forEach(sec => {
    if (!isShown(sec, s)) return;
    (sec.fields || []).forEach(f => {
      if (!fShown(f, s)) return;
      const v = getP(s, f.p), req = fReq(f, s), rec = fRec(f, s);
      if (req && empty(v)) out.push({ level: "req", label: f.l, anchor: f.p });
      else if (req && f.min && f.t === "textarea" && String(v).length < f.min) out.push({ level: "req", label: `${f.l} (at least ${f.min} characters; now ${String(v).length})`, anchor: f.p });
      else if (rec && empty(v)) out.push({ level: "rec", label: f.l, anchor: f.p });
      else if (f.p === "inc.description" && String(v).length < 400) out.push({ level: "rec", label: "Description: aim for a full account (400+ characters)", anchor: f.p });
    });
  });
  if (notAb(s) && !(s.laws || []).length) out.push({ level: "req", label: "Law infringement", anchor: "laws" });
  const rp = s.reporter, o = rp != null ? s.officials[rp] : null;
  if (rp == null) out.push({ level: "req", label: "Reporting official (who is signing)", anchor: "reporter" });
  else {
    if (empty(o.name)) out.push({ level: "req", label: "Reporting official's name", anchor: "officials.name" });
    if (empty(o.phone)) out.push({ level: "req", label: "Reporting official's contact number", anchor: "officials.phone" });
    if (empty(o.email) || !/^\S+@\S+\.\S+$/.test(o.email)) out.push({ level: "req", label: "Reporting official's valid e-mail", anchor: "officials.email" });
  }
  if (!s.decl?.agree) out.push({ level: "req", label: "Tick the declaration", anchor: "decl.agree" });
  if (empty(s.decl?.typed)) out.push({ level: "req", label: "Type your full name", anchor: "decl.typed" });
  if (empty(s.decl?.sig)) out.push({ level: "req", label: "Draw your signature", anchor: "sig" });
  return out;
}

/* ---------- field rendering ---------- */
function fieldHTML(f, s) {
  const v = getP(s, f.p), id = "f_" + f.p.replace(/\./g, "_"), req = fReq(f, s);
  const lab = `${esc(f.l)}${req ? ' <span class="req" aria-hidden="true">*</span>' : ""}`;
  const err = showErrors && req && (empty(v) || (f.min && f.t === "textarea" && String(v).length < f.min));
  let ctl = "";
  if (f.t === "select") ctl = `<select id="${id}" data-p="${f.p}"><option value="">Select…</option>${f.opts.map(o => `<option ${v === o ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
  else if (f.t === "radio" || f.t === "chips") {
    const multi = f.t === "chips";
    ctl = `<div class="opts" role="${multi ? "group" : "radiogroup"}" aria-label="${esc(f.l)}">${f.opts.map(o => { const on = multi ? (v || []).includes(o) : v === o; return `<label class="opt"><input type="${multi ? "checkbox" : "radio"}" name="${id}" data-p="${f.p}" data-v="${esc(o)}" ${on ? "checked" : ""}>${esc(o)}</label>`; }).join("")}</div>`;
  } else if (f.t === "textarea") ctl = `<textarea id="${id}" data-p="${f.p}" rows="${f.big ? 9 : 3}">${esc(v || "")}</textarea>` + (f.min ? `<div class="hint" data-count="${f.p}">${String(v || "").length} characters (minimum ${f.min})</div>` : "") + (f.p === "inc.description" ? aiToolsHTML() : "");
  else {
    let extra = "", list = "";
    if (f.t === "number") extra = ` inputmode="numeric" min="${f.min ?? ""}" max="${f.max ?? ""}"`;
    if (f.list) { list = ` list="dl_${id}"`; ctl = `<datalist id="dl_${id}">${f.list(s).map(o => `<option value="${esc(o)}">`).join("")}</datalist>`; }
    ctl += `<input id="${id}" type="${f.t}" data-p="${f.p}" value="${esc(v ?? "")}"${extra}${list} autocomplete="off">`;
  }
  const isGroup = f.t === "radio" || f.t === "chips";
  return `<div class="f${f.full ? " full" : ""}${err ? " err" : ""}" data-anchor="${f.p}">${isGroup ? `<div class="lab">${lab}</div>` : `<label for="${id}">${lab}</label>`}${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ""}${ctl}${err ? '<div class="errmsg">This is required.</div>' : ""}</div>`;
}
function lawsHTML(s) {

function officialsHTML(s) {

function tryFinalise() {
  const items = check(R), req = items.filter(i => i.level === "req"), rec = items.filter(i => i.level === "rec");
  if (req.length) { showErrors = true; const order = STEPS.map(x => x.id), ks = req.map(i => stepForAnchor(i.anchor)).filter(Boolean).sort((x, y) => order.indexOf(x) - order.indexOf(y)); if (ks[0]) stepId = ks[0]; paint(); window.scrollTo(0, 0); const first = $(".f.err,.errmsg"); first && first.scrollIntoView({ behavior: "smooth", block: "center" }); return; }
  const extra = rec.length ? `<div class="note warn"><b>${rec.length} recommended item${rec.length > 1 ? "s" : ""} not completed:</b><br>${rec.map(i => "• " + esc(i.label)).join("<br>")}<br>Completed detail makes a report harder to challenge.</div>` : "";
  confirmBox("Finalise and lock this report?", "Once finalised the report <b>cannot be edited</b>. You can add dated addenda later. The time is recorded and a SHA-256 fingerprint is stored with it.", "Finalise report", async () => {
    R.status = "final"; R.finalisedAt = new Date().toISOString(); R.decl.signedAt = R.finalisedAt; R.decl.userAgent = navigator.userAgent.slice(0, 120);
    R.addenda = []; R.hash = await hashReport(R); R.updatedAt = R.finalisedAt;
    store.put(R); location.hash = "#/view/" + R.id;
  }, extra);
}

/* ---------- report document ---------- */
const row = (k, v) => `<tr><th>${esc(k)}</th><td>${v === "" || v == null ? "—" : esc(v)}</td></tr>`;
function docHTML(r) {
  const T = TYPES[r.type], m = r.match, p = r.player || {}, i = r.inc || {}, d = r.dec || {}, o = r.officials[r.reporter] || {};
  const colour = { yellow: "#f4c20d", red: "#d62828", blue: "#1f6fd1", abandoned: "#999" }[r.type];
  const lawsTxt = (r.laws || []).map((c, n) => { const it = LAWS.flatMap(g => g.items).find(x => x[0] === c); return `<tr><td style="width:80px"><b>${n ? "" : "Primary "}${c}</b></td><td>${esc(it ? it[1] : "")}</td></tr>`; }).join("");
  let h = `<article class="doc t-${r.type}" id="docroot">
  <div class="hd"><div><div style="font-size:12px;text-transform:uppercase;letter-spacing:.06em">${esc(CFG.orgFull)} (${esc(CFG.orgName)})</div><h1><span class="big" style="background:${colour}"></span>Referee / Assistant Referee report</h1><div style="margin-top:4px"><b>${esc(T.long)}</b></div></div>
   <div style="text-align:right"><div><b>Report no.</b><br><span class="hash">${esc(r.id)}</span></div>${r.status === "final" ? "" : '<div class="draftmark" style="margin-top:6px">DRAFT – NOT FINALISED</div>'}</div></div>
  <section><h2>Match</h2><table>${row("Competition", m.competition)}${row("Level", m.level)}${row("Home team", m.home)}${row("Visiting team", m.away)}${row("Venue", m.venue)}${row("Date of match", fmtDate(m.date))}${row("Kick-off", m.kickoff)}${row("Period / elapsed time", `${m.period || "—"} · ${m.elapsed ?? "—"} min${m.timeSource ? " (" + m.timeSource + ")" : ""}`)}${row("Score at the time", m.scoreHome != null && m.scoreAway != null ? `${m.home} ${m.scoreHome} – ${m.scoreAway} ${m.away}` : "")}${row("Conditions", m.conditions)}</table></section>`;
  if (r.type !== "abandoned") {
    h += `<section><h2>Player</h2><table>${row("Full name", p.name)}${row("Team", p.team)}${row("Playing number", p.number)}${row("Position", p.position)}${row("Captain", p.captain)}${row("Earlier card in this match", p.prior === "Yellow card" ? `Yellow card at ${p.priorTime} min` : p.prior)}</table></section>
    <section><h2>Law infringement</h2><table>${lawsTxt}</table></section>
    <section><h2>Incident particulars</h2><table>${row("Phase of play", i.phase)}${row("Location", i.zone)}${row("Advantage", i.advantage)}${row("Sanction / restart", i.restart)}${row("Offender's body part", i.bodyPart)}${row("Referee's assessment", i.assessment)}${r.type !== "blue" ? row("Opponent affected", [i.vName, i.vNumber ? "#" + i.vNumber : ""].filter(Boolean).join(" ")) + row("Part of opponent contacted", i.contact) + row("Injury to opponent", i.injury) : ""}</table></section>`;
  }
  const hasDc = r.type !== "blue" && r.type !== "abandoned" && hasLaw(r, ...TACKLE, "9.20.b") && Object.values(r.dc || {}).some(Boolean);
  if (hasDc) h += `<section><h2>Dangerous contact – observed facts</h2><table>${row("Head / neck contact", r.dc.headContact)}${row("First contact", r.dc.firstContact)}${row("Tackler's arms", r.dc.arms)}${row("Tackler's position", r.dc.tacklerHeight)}${row("Ball-carrier's position", r.dc.carrierHeight)}${row("Force", r.dc.force)}${row("Open-field play", r.dc.open)}</table></section>`;
  h += `<section><h2>Description of offence</h2><div class="narr">${esc(i.description)}</div>${r.aiAssisted ? '<div class="foot">AI-assisted drafting: the wording of this narrative was suggested by an AI writing tool from the reporting official\'s own notes, and was reviewed and adopted by the reporting official.</div>' : ""}`;
  if (r.type !== "abandoned") h += `<table style="margin-top:8px">${row("Mitigating factors", i.mitigating)}${row("Aggravating factors", i.aggravating)}${row("Player's response / words", i.response)}${row("Earlier warnings / cautions", i.warnings)}</table>`;
  h += `</section><section><h2>Decision and process</h2><table>${row("Detected / referred by", d.detected)}${row("Time card shown", d.cardTime != null ? d.cardTime + " min" : "")}${row("TMO review", d.tmo === "Yes" ? "Yes – " + (d.tmoOutcome || "") : d.tmo)}${row("(a) Individual caution", d.individual)}${row("(b) General caution", d.general)}${row("Captain spoken to", d.captain === "Yes" ? "Yes – " + (d.captainNotes || "") : d.captain)}</table></section>`;
  if (r.type === "yellow") h += `<section><h2>Yellow card detail</h2><table>${row("Eligible to return at", r.yc.eligible != null ? r.yc.eligible + " min" : "")}${row("Front-row player suspended", r.yc.frontRow)}${row("Uncontested scrums ordered", r.yc.uncontested)}${row("Returned correctly / on time", r.yc.returned)}${row("Notes", r.yc.notes)}</table></section>`;
  if (r.type === "red") h += `<section><h2>Red card detail</h2><table>${row("Basis", r.rc.kind)}${row("Left playing area", r.rc.left)}${row("Further misconduct after card", r.rc.further)}${row("Told a report would follow", r.rc.informed)}${row("Replacement position explained", r.rc.replaced)}${row("Notes", r.rc.notes)}</table></section>`;
  if (r.type === "blue") h += `<section><h2>Blue card detail – suspected concussion</h2><table>${row("Signs observed", (r.bc.signs || []).join("; "))}${row("How it happened", r.bc.mechanism)}${row("Foul play involved", r.bc.foul + (r.bc.foulRef ? " – related report " + r.bc.foulRef : ""))}${row("Signs identified by", r.bc.by)}${row("Medical person attending", r.bc.medical + (r.bc.medName ? " – " + r.bc.medName : ""))}${row("Left the field", r.bc.removed != null ? r.bc.removed + " min" : "")}${row("Replacement", r.bc.replacement)}${row("Player's cooperation", r.bc.attitude)}${row("Told not to return and to follow concussion protocol", r.bc.advised)}${row("Notes", r.bc.notes)}</table><div class="foot">Recorded as an observation under Law 3.24 (Recognise and Remove). This is not a medical diagnosis.</div></section>`;
  if (r.type === "abandoned") h += `<section><h2>Match blown off</h2><table>${row("Reason", r.ab.reason)}${row("Time abandoned", r.ab.time != null ? r.ab.time + " min" : "")}${row("Score", r.ab.score)}${row("Persons involved", r.ab.persons)}${row("Who was informed and when", r.ab.informed)}</table></section>`;
  h += `<section><h2>Evidence and witnesses</h2><table>${row("Video evidence", r.ev.video)}${row("Held by / details", r.ev.videoDetail)}${row("Other witnesses", r.ev.witnesses)}${row("Other information", r.ev.other)}</table></section>
  <section><h2>Match officials</h2><table><tr><th style="width:auto">Role</th><th style="width:auto">Name</th><th style="width:auto">Contact</th><th style="width:auto">E-mail</th></tr>${r.officials.map((x, n) => `<tr><td>${esc(x.role)}${n === r.reporter ? " <b>(reporting)</b>" : ""}</td><td>${esc(x.name || "—")}</td><td>${esc(x.phone || "—")}</td><td>${esc(x.email || "—")}</td></tr>`).join("")}</table>${r.society ? `<div class="foot">Society / association: ${esc(r.society)}</div>` : ""}</section>
  <section><h2>Declaration</h2><p>I declare that this report is a true and accurate account of what I personally saw, heard and did, made as soon as practicable after the match, and that I understand it may be used in disciplinary proceedings.</p>
   <table>${row("Reporting official", `${o.name || ""} (${o.role || ""})`)}${row("Typed name", r.decl.typed)}<tr><th>Signature</th><td>${r.decl.sig ? `<img class="sig" alt="Signature" src="${r.decl.sig}">` : "—"}</td></tr>${row("Report started", fmtDT(r.createdAt))}${row("Finalised / signed", r.status === "final" ? fmtDT(r.finalisedAt) : "Not finalised")}</table></section>`;
  if ((r.addenda || []).length) h += `<section><h2>Addenda (added after finalisation)</h2>${r.addenda.map((a, n) => `<table style="margin-bottom:8px">${row("Addendum " + (n + 1) + " – added", fmtDT(a.at))}<tr><th>Text</th><td style="white-space:pre-wrap">${esc(a.text)}</td></tr><tr><th>Seal</th><td class="hash">${esc(a.hash)}</td></tr></table>`).join("")}</section>`;
  h += `<section><h2>Integrity</h2><table><tr><th>SHA-256 of report content</th><td class="hash">${esc(r.hash || "Not yet sealed (draft)")}</td></tr></table><div class="foot">The fingerprint is calculated over the content above at the moment of finalisation; any later change to the original content produces a different value. ${esc(CFG.privacyNote)}<br>Laws reference: ${esc(CFG.lawsEdition)}.</div></section></article>`;
  return h;
}
async function verify(r) {
  if (r.status !== "final") return { ok: false, msg: "Draft – not sealed." };
  const h = await hashReport(r); if (h === "unavailable") return { ok: false, msg: "This browser cannot calculate SHA-256 here (needs https or localhost)." };
  if (h !== r.hash) return { ok: false, msg: "MISMATCH – the stored content no longer matches its fingerprint." };
  let prev = r.hash;
  for (const a of r.addenda || []) { const x = await sha(prev + "|" + a.at + "|" + a.text); if (x !== a.hash) return { ok: false, msg: "MISMATCH in addenda chain." }; prev = x; }
  return { ok: true, msg: "Verified – content matches the SHA-256 fingerprint recorded at signing." };
}
function viewReport(id) {
  const r = store.get(id); if (!r) return notFound();
  const app = $("#app");
  app.innerHTML = `<div class="row noprint" style="margin:16px 0"><a class="btn" href="#/dashboard">← Dashboard</a><span class="spacer"></span>
   ${r.status === "draft" ? `<a class="btn primary" href="#/edit/${esc(r.id)}">Continue editing</a>` : ""}
   <button class="btn primary" id="print">Print / save as PDF</button><button class="btn" id="json">Download JSON</button>${CFG.disciplineEmail && r.status === "final" ? '<button class="btn" id="mail">E-mail to union</button>' : ""}
   ${r.status === "final" ? '<button class="btn" id="verify">Verify integrity</button><button class="btn" id="addendum">Add addendum</button>' : ""}<button class="btn danger" id="del">Delete</button></div>
   <div class="noprint" id="vmsg" role="status" style="margin-bottom:10px"></div>${docHTML(r)}`;
  document.title = `${r.id} – ${CFG.appTitle}`;
  $("#print").onclick = () => window.print();
  $("#json").onclick = () => download(r.id + ".json", JSON.stringify(r, null, 2), "application/json");
  const mail = $("#mail"); if (mail) mail.onclick = () => { const s = encodeURIComponent(`${TYPES[r.type].name} report ${r.id} – ${r.player?.name || r.match.competition}`); const b = encodeURIComponent(`Please find my signed ${TYPES[r.type].name.toLowerCase()} report ${r.id}.\nMatch: ${r.match.home} v ${r.match.away}, ${fmtDate(r.match.date)}.\nSHA-256: ${r.hash}\n\nI have attached the PDF and the JSON file.\n${r.officials[r.reporter].name}`); location.href = `mailto:${CFG.disciplineEmail}?subject=${s}&body=${b}`; };
  const v = $("#verify"); if (v) v.onclick = async () => { const x = await verify(r); $("#vmsg").innerHTML = `<div class="note ${x.ok ? "" : "warn"}"><b>${x.ok ? "✓" : "✗"}</b> ${esc(x.msg)}</div>`; };
  $("#del").onclick = () => confirmBox("Delete this report?", r.status === "final" ? "This is a <b>finalised, signed</b> report. Download the JSON first if you need a copy. This removes it from this device only." : "The draft will be removed from this device.", "Delete", () => { store.del(r.id); location.hash = "#/dashboard"; });
  const ad = $("#addendum"); if (ad) ad.onclick = () => confirmBox("Add addendum", "An addendum is added after the original and shown separately. The original stays unchanged and sealed.", "Add addendum", async () => {
    const t = ($("#adtxt")?.value || "").trim(); if (!t) return; const at = new Date().toISOString(); const prev = (r.addenda || []).length ? r.addenda.at(-1).hash : r.hash;
    r.addenda = r.addenda || []; r.addenda.push({ at, text: t, hash: await sha(prev + "|" + at + "|" + t) }); store.put(r); viewReport(id);
  }, '<div class="f"><label for="adtxt">Addendum text</label><textarea id="adtxt" rows="5"></textarea></div>');
}

/* ---------- dashboard ---------- */
let filt = { q: "", type: "", team: "", comp: "" };
function dashboard() {
  const all = Object.values(store.all()).sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""));
  const app = $("#app");
  const n = t => all.filter(r => r.type === t).length;
  const teams = [...new Set(all.map(r => r.player?.team).filter(Boolean))].sort(), comps = [...new Set(all.map(r => r.match?.competition).filter(Boolean))].sort();
  app.innerHTML = `<div class="row"><div><h1>Dashboard</h1><p class="sub">Card reports stored on this device. Import files from other referees to combine them.</p></div><span class="spacer"></span>
    <button class="btn" id="imp">Import JSON</button><button class="btn" id="expAll">Export all (JSON)</button><button class="btn" id="expCsv">Export CSV</button><input type="file" id="file" accept="application/json,.json" multiple hidden></div>
   <div class="tiles"><div class="tile a"><b>${all.length}</b><span>Total reports</span></div><div class="tile y"><b>${n("yellow")}</b><span>Yellow cards</span></div><div class="tile r"><b>${n("red")}</b><span>Red cards</span></div><div class="tile b"><b>${n("blue")}</b><span>Blue cards</span></div><div class="tile a"><b>${all.filter(r => r.status === "draft").length}</b><span>Drafts</span></div></div>
   <div id="charts"></div>
   <div class="card"><h2>Reports</h2><div class="filters"><input type="search" id="q" placeholder="Search name, team, venue, report no." value="${esc(filt.q)}" aria-label="Search">
     <select id="ft" aria-label="Card type"><option value="">All cards</option>${Object.entries(TYPES).map(([k, v]) => `<option value="${k}" ${filt.type === k ? "selected" : ""}>${v.name}</option>`).join("")}</select>
     <select id="fc" aria-label="Competition"><option value="">All competitions</option>${comps.map(c => `<option ${filt.comp === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>
     <select id="fm" aria-label="Team"><option value="">All teams</option>${teams.map(c => `<option ${filt.team === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></div>
   <div class="tablewrap" id="tbl"></div></div>`;
  const draw = () => {
    const q = filt.q.toLowerCase();
    const rows = all.filter(r => (!filt.type || r.type === filt.type) && (!filt.team || r.player?.team === filt.team) && (!filt.comp || r.match?.competition === filt.comp) && (!q || JSON.stringify([r.id, r.player?.name, r.player?.team, r.match?.home, r.match?.away, r.match?.venue, r.match?.competition]).toLowerCase().includes(q)));
    $("#tbl").innerHTML = rows.length ? `<table><thead><tr><th>Date</th><th>Card</th><th>Player</th><th>Match</th><th>Law</th><th>Min</th><th>Status</th><th>Report</th></tr></thead><tbody>${rows.map(r => `<tr class="clickable" tabindex="0" data-id="${esc(r.id)}"><td>${fmtDate(r.match?.date)}</td><td><span class="pill ${r.type}">${esc(TYPES[r.type]?.name)}</span></td><td>${esc(r.player?.name || "—")}<br><span class="hint">${esc(r.player?.team || "")}${r.player?.number ? " #" + esc(r.player.number) : ""}</span></td><td>${esc(r.match?.home)} v ${esc(r.match?.away)}<br><span class="hint">${esc(r.match?.competition || "")}</span></td><td>${esc((r.laws || []).join(", ") || "—")}</td><td>${esc(r.match?.elapsed ?? "—")}</td><td><span class="pill ${r.status}">${r.status === "final" ? "Final" : "Draft"}</span></td><td class="hint">${esc(r.id)}</td></tr>`).join("")}</tbody></table>` : `<div class="empty">${all.length ? "No reports match these filters." : "No reports yet. Start with “+ New card report”."}</div>`;
    $$("#tbl tr.clickable").forEach(tr => { const go = () => location.hash = (store.get(tr.dataset.id).status === "draft" ? "#/edit/" : "#/view/") + tr.dataset.id; tr.onclick = go; tr.onkeydown = e => { if (e.key === "Enter") go(); }; });
  };
  draw();
  $("#q").oninput = e => { filt.q = e.target.value; draw(); };
  $("#ft").onchange = e => { filt.type = e.target.value; draw(); }; $("#fc").onchange = e => { filt.comp = e.target.value; draw(); }; $("#fm").onchange = e => { filt.team = e.target.value; draw(); };
  charts(all);
  $("#imp").onclick = () => $("#file").click();
  $("#file").onchange = async e => { let ok = 0, bad = 0; for (const f of e.target.files) { try { const j = JSON.parse(await f.text()); for (const r of (Array.isArray(j) ? j : [j])) { if (!r.id || !r.type || !r.match) { bad++; continue; } if (r.status === "final") { const v = await verify(r); r.importedVerified = v.ok; if (!v.ok && v.msg.startsWith("MISMATCH")) { bad++; continue; } } store.put(r); ok++; } } catch (x) { bad++; } } alert(`Imported ${ok} report(s).${bad ? " " + bad + " skipped (invalid or failed integrity check)." : ""}`); dashboard(); };
  $("#expAll").onclick = () => download(`card-reports-${today()}.json`, JSON.stringify(all, null, 2), "application/json");
  $("#expCsv").onclick = () => { const cols = [["Report no.", r => r.id], ["Status", r => r.status], ["Card", r => TYPES[r.type]?.name], ["Date", r => r.match?.date], ["Competition", r => r.match?.competition], ["Home", r => r.match?.home], ["Visitors", r => r.match?.away], ["Venue", r => r.match?.venue], ["Period", r => r.match?.period], ["Minute", r => r.match?.elapsed], ["Player", r => r.player?.name], ["Team", r => r.player?.team], ["Number", r => r.player?.number], ["Position", r => r.player?.position], ["Laws", r => (r.laws || []).join(" ")], ["Assessment", r => r.inc?.assessment], ["Reporting official", r => r.officials?.[r.reporter]?.name], ["Finalised", r => r.finalisedAt], ["SHA-256", r => r.hash]]; const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`; download(`card-reports-${today()}.csv`, [cols.map(c => q(c[0])).join(","), ...all.map(r => cols.map(c => q(c[1](r))).join(","))].join("\n"), "text/csv"); };
}
function bars(title, data, max) {
  const m = max || Math.max(1, ...data.map(d => d[1]));
  return `<div class="card"><h2>${esc(title)}</h2>${data.length ? `<div class="bars">${data.map(([l, v]) => `<div class="bar-row"><span class="lbl" title="${esc(l)}">${esc(l)}</span><span class="track"><span class="fill" style="display:block;width:${Math.round(100 * v / m)}%"></span></span><b>${v}</b></div>`).join("")}</div>` : '<p class="hint">No data yet.</p>'}</div>`;
}
function charts(all) {
  const cnt = (f) => { const o = {}; all.forEach(r => { const k = f(r); if (k) o[k] = (o[k] || 0) + 1; }); return Object.entries(o).sort((a, b) => b[1] - a[1]).slice(0, 8); };
  const b = [["0–20", 0], ["21–40", 0], ["41–60", 0], ["61–80", 0], ["80+", 0]];
  all.forEach(r => { const e = r.match?.elapsed; if (e == null) return; b[e <= 20 ? 0 : e <= 40 ? 1 : e <= 60 ? 2 : e <= 80 ? 3 : 4][1]++; });
  const lc = {}; all.forEach(r => (r.laws || []).forEach(c => lc[c] = (lc[c] || 0) + 1));
  const lawCounts = Object.entries(lc).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([c, n]) => ["Law " + c, n]);
  $("#charts").innerHTML = `<div class="grid2">${bars("Cards by match minute", b)}${bars("Cards by team", cnt(r => r.player?.team))}${bars("Most cited laws", lawCounts)}${bars("Cards by competition", cnt(r => r.match?.competition))}</div>`;
}

function notFound() { $("#app").innerHTML = `<div class="empty"><h1>Report not found</h1><p>It may have been created on a different device or browser. Use Import JSON on the dashboard.</p><a class="btn primary" href="#/dashboard">Dashboard</a></div>`; }

/* ---------- router ---------- */
function route() {
  document.title = CFG.appTitle; R = R && R.status === "final" ? null : R;
  const [, view, id] = (location.hash || "#/dashboard").split("/");
  $$("[data-nav]").forEach(a => a.classList.toggle("on", a.dataset.nav === view || (a.dataset.nav === "dashboard" && !["new", "edit"].includes(view))));
  window.scrollTo(0, 0);
  if (view === "new") editor("new"); else if (view === "edit") editor(id); else if (view === "view") viewReport(id); else dashboard();
  $("#app").focus({ preventScroll: true });
}
$("#brandText").textContent = CFG.appTitle; $("#footNote").textContent = `${CFG.orgFull}. Reports are stored in this browser only until you export or send them. ${CFG.lawsEdition}.`;
window.addEventListener("hashchange", route); window.addEventListener("beforeunload", () => persist());
route();
})();

</script>
</body>
</html>
